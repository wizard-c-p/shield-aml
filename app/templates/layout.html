<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>ShieldAML Command Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        /* Custom UX Tweaks */
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; transition: background-color 0.3s; }
        .navbar-brand { font-weight: 700; letter-spacing: -0.5px; }
        .card { border: none; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); transition: transform 0.2s; }
        .card:hover { transform: translateY(-2px); }
        .status-badge { font-size: 0.85em; letter-spacing: 0.05em; text-transform: uppercase; }
        
        /* Dark Mode Specifics */
        [data-bs-theme="dark"] .navbar { background-color: #0f172a !important; border-bottom: 1px solid #1e293b; }
        [data-bs-theme="dark"] body { background-color: #020617; }
        [data-bs-theme="dark"] .card { background-color: #1e293b; border: 1px solid #334155; }
        
        /* Light Mode Specifics */
        [data-bs-theme="light"] .navbar { background-color: #ffffff !important; border-bottom: 1px solid #e2e8f0; }
        [data-bs-theme="light"] body { background-color: #f8fafc; }
        [data-bs-theme="light"] .card { background-color: #ffffff; border: 1px solid #e2e8f0; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg px-4 py-3">
        <div class="container-fluid">
            <a class="navbar-brand text-primary" href="/">
                <i class="bi bi-shield-lock-fill"></i> ShieldAML <span class="badge bg-primary text-white ms-2" style="font-size: 0.6em;">v10</span>
            </a>
            
            <div class="d-flex align-items-center">
                <ul class="navbar-nav flex-row me-4">
                    <li class="nav-item me-3"><a class="nav-link" href="/"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a></li>
                    <li class="nav-item me-3"><a class="nav-link" href="/history"><i class="bi bi-clock-history me-1"></i> History</a></li>
                    <li class="nav-item me-3"><a class="nav-link" href="/lists"><i class="bi bi-list-check me-1"></i> Lists</a></li>
                    <li class="nav-item"><a class="nav-link" href="/config"><i class="bi bi-sliders me-1"></i> Config</a></li>
                </ul>
                
                <button class="btn btn-outline-secondary btn-sm" id="themeToggle" onclick="toggleTheme()">
                    <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            const current = html.getAttribute('data-bs-theme');
            
            if (current === 'dark') {
                html.setAttribute('data-bs-theme', 'light');
                icon.className = 'bi bi-sun-fill';
            } else {
                html.setAttribute('data-bs-theme', 'dark');
                icon.className = 'bi bi-moon-stars-fill';
            }
        }
    </script>
</body>
</html>
